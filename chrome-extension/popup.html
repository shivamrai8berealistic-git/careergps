<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #111827;
      margin: 0;
    }
    h2 {
      font-size: 18px;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 16px;
      padding: 8px;
      background: #f3f4f6;
      border-radius: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
    }
    .dot.connected {
      background-color: #10b981;
    }
    .hidden {
      display: none;
    }
    #auth-section { margin-bottom: 16px; }
  </style>
</head>
<body>
  <h2>Career Pilot AI</h2>
  
  <div class="status">
    <div id="status-dot" class="dot"></div>
    <span id="status-text">Not Connected</span>
  </div>

  <div id="auth-section">
    <p>Please open the Command Center to sync your session.</p>
    <button id="btn-login">Open Command Center</button>
  </div>

  <div id="capture-section" class="hidden">
    <p>Capture the current page to your Career Memory.</p>
    <button id="btn-capture">Capture Current Job</button>
    <p id="capture-msg" style="color: #10b981; margin-top: 8px; font-weight: bold; text-align: center;" class="hidden"></p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
